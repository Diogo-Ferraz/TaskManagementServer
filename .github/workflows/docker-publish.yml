name: Publish Backend Images

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/TaskManagement.Api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            diogopro/taskmanagement-api:latest
            diogopro/taskmanagement-api:sha-${{ github.sha }}

      - name: Build and push Auth image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/TaskManagement.Auth/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            diogopro/taskmanagement-auth:latest
            diogopro/taskmanagement-auth:sha-${{ github.sha }}
